name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true 

      - name: Install Hugging Face Hub & Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "ERROR: Please set HF_TOKEN, HF_USERNAME and HF_SPACE in repository Secrets."
            exit 1
          fi
          
          pip install huggingface_hub
          
          # පයිතන් කෝඩ් එක ආරක්ෂිතව Heredoc (<< 'EOF') ක්‍රමයට ලිවීම
          python << 'EOF'
          import os
          from huggingface_hub import HfApi
          
          # Environment variables වලින් විස්තර ලබාගැනීම
          hf_token = os.getenv("HF_TOKEN")
          repo_id = f"{os.getenv('HF_USERNAME')}/{os.getenv('HF_SPACE')}"
          
          print(f"Deploying to Hugging Face Space: {repo_id}")
          
          api = HfApi(token=hf_token)
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=['.git*', '.github*']
          )
          print("Deployment successful!")
          EOF